<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NSM-10</title>
<style>
:root{--bg:#0D1117;--nav:#10151C;--card:#161B22;--inset:#10151C;--line:#262D38;--line2:#1F2630;--text:#E6EDF3;--mute:#9BA7B4;--soft:#B6C2CF;--accent:#58A6FF;--ok:#56D364;--warn:#F5B84A;--crit:#FF8E86}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--soft);text-decoration:none}a:hover{color:#fff}
h1{margin:0;font-size:26px;font-weight:600}h2{margin:0;font-size:16px;font-weight:600}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace}
.mute{color:var(--mute)}.ok{color:var(--ok)}.warn{color:var(--warn)}.crit{color:var(--crit)}
.shell{display:flex;flex-wrap:wrap;min-height:100vh}
nav{flex:1 1 220px;background:var(--nav);border-right:1px solid #222A35;padding:20px 14px;display:flex;flex-direction:column;gap:20px}
.brand{font-size:19px;font-weight:600;padding:0 12px;letter-spacing:.2px}
.group{display:flex;flex-direction:column;gap:2px}
.group .label{padding:0 12px 6px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#8B98A8}
nav a{display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 12px;border-radius:8px}
nav a.on{background:#1C2430;color:#fff;font-weight:600}
.badge{font-size:12px;background:#3A2A12;color:var(--warn);padding:2px 8px;border-radius:10px}
.host{margin-top:auto;padding:12px;border:1px solid #222A35;border-radius:8px;font-size:12px;color:var(--mute)}
main{flex:999 1 560px;min-width:0;padding:24px 28px 40px;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
header .grow{flex:1 1 240px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;color:var(--text);display:block}
.tile .k{color:var(--mute);font-size:12px}.tile .v{font-size:26px;font-weight:600}.tile .v small{font-size:14px;color:var(--mute);font-weight:500}.tile .s{font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:20px}.row>.card{flex:1 1 340px}.row>.wide{flex:3 1 520px}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:500;color:var(--mute);padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
tr:last-child td{border-bottom:0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:13px}.kv:last-child{border-bottom:0}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.inset{background:var(--inset);border-radius:8px;padding:14px 16px}
.bar{height:6px;background:#232B36;border-radius:3px;margin-top:4px}.bar>i{display:block;height:6px;border-radius:3px;background:var(--accent)}.bar>i.hot{background:var(--warn)}
.node{display:grid;grid-template-columns:90px repeat(3,minmax(0,1fr));gap:14px;align-items:center;font-size:12px;margin-bottom:14px}
.alert{padding:11px 0;border-bottom:1px solid var(--line2)}.alert:last-child{border-bottom:0}
.alert .top{display:flex;justify-content:space-between;gap:10px;font-size:12px}
button,.btn{min-height:44px;padding:0 14px;background:#1C2430;border:1px solid #2A323E;border-radius:8px;color:var(--text);font:inherit;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#06121F;font-weight:600}
button:disabled{opacity:.5;cursor:default}
input,select{min-height:44px;width:100%;padding:0 10px;background:#0D1117;border:1px solid #2A323E;border-radius:8px;color:var(--text);font:inherit}
input[type=checkbox]{width:20px;min-height:20px;height:20px;accent-color:var(--accent)}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute)}
label.check{flex-direction:row;align-items:center;gap:8px;min-height:44px;font-size:14px;color:var(--text)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:12px}
.dev{border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:12px}
.note{font-size:13px;color:var(--mute);margin:6px 0 0}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.center .card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.empty{color:var(--mute);padding:14px 0}
.tree{overflow-x:auto;padding:6px 0 10px}
.tree ul{display:flex;justify-content:center;list-style:none;margin:0;padding:22px 0 0;position:relative;min-width:max-content}
.tree li{position:relative;padding:22px 7px 0;display:flex;flex-direction:column;align-items:center}
.tree li::before,.tree li::after{content:"";position:absolute;top:0;right:50%;width:50%;height:22px;border-top:1px dashed #4A7FB8}
.tree li::after{right:auto;left:50%;border-left:1px dashed #4A7FB8}
.tree li:only-child::before,.tree li:only-child::after{display:none}
.tree li:only-child{padding-top:0}
.tree li:first-child::before,.tree li:last-child::after{border:0 none}
.tree li:last-child::before{border-right:1px dashed #4A7FB8}
.tree ul ul::before{content:"";position:absolute;top:0;left:50%;height:22px;border-left:1px dashed #4A7FB8}
.tree>ul{padding-top:0}.tree>ul>li{padding-top:0}.tree>ul>li::before,.tree>ul>li::after{display:none}
.tnode{min-height:44px;width:158px;padding:10px 12px;text-align:left;background:#101A28;border:1px solid #2F4A6B;border-radius:8px;display:flex;flex-direction:column;gap:2px;font-size:12px;line-height:1.35}
.tnode.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tnode .nm{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;overflow-wrap:anywhere}
.tnode svg{flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{background:var(--inset);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;min-width:130px}
.leafbox{width:330px;max-width:80vw;background:#0E1622;border:1px solid #2F4A6B;border-radius:8px;padding:10px 12px;font-size:12px}
.leafbox .chips{gap:6px;margin-top:8px}.leafbox .chip{min-width:0;flex:1 1 140px;padding:6px 8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--mute);margin-top:6px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div id="app"></div>

    srcTile("zdx", "#zscaler", "ZDX score", s => tile("#zscaler", "ZDX score", s.score == null ? dash : s.score, "/ 100", s.score == null ? "No scored apps" : s.score >= 66 ? "● Good" : s.score >= 34 ? "▲ Okay" : "✕ Poor", s.score == null ? "mute" : s.score >= 66 ? "ok" : s.score >= 34 ? "warn" : "crit")),

    $("div", {class: "row"},

    $("section", {class: "card"}, $("div", {class: "head"}, $("h2", null, "Guests")), $("div", {class: "scroll"}, $("table", null,
      $("thead", null, $("tr", null, ["ID", "Name", "Type", "Node", "Status", "CPU", "Memory"].map(h => $("th", null, h)))),
      $("tbody", null, s.guests.map(g => $("tr", null, $("td", {class: "mono"}, g.vmid), $("td", {style: "font-weight:500"}, g.name), $("td", null, g.type), $("td", null, g.node),
        $("td", {class: g.status === "running" ? "ok" : "mute"}, (g.status === "running" ? "● " : "○ ") + g.status),
